{% extends 'base.html' %}
{% block content %}

<section class="card">
    <h1>Player Search</h1>
    <p class="muted">Search by player name and open detailed performance stats.</p>
    <form method='GET' action='/players' class="inline-form">
        <input type='text' name='name' placeholder='Search player...' value='{{ name }}'>
        <button type='submit'>Search</button>
    </form>
</section>

<section class="card">
    {% if results %}
    <table>
        <tr><th>ID</th><th>Name</th><th>Team</th></tr>
        {% for row in results %}
        <tr>
            <td>{{ row[0] }}</td>
            <td><a href='/players/{{ row[0] }}'>{{ row[1] }}</a></td>
            <td>{{ row[2] }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p class="empty-state">No players found.</p>
    {% endif %}
</section>


{% endblock %}
