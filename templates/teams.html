{% extends 'base.html' %}
{% block content %}

<h1>Team Insights</h1>

<table>
    <tr><th>ID</th><th>Team</th><th>City</th><th>Conference</th></tr>
    {% for team in teams %}
    <tr>
        <td>{{ team[0] }}</td>
        <td><a href='/teams/{{ team[0] }}'>{{ team[1] }}</a></td>
        <td>{{ team[2] }}</td>
        <td>{{ team[3] }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
