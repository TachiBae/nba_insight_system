{% extends 'base.html' %}
{% block content %}

<section class="card">
    <h1>Team Insights</h1>
    <p class="muted">Browse all teams and open details for performance summaries.</p>
</section>

<section class="card">
    <table>
        <tr><th>ID</th><th>Team</th><th>City</th><th>Conference</th></tr>
        {% for team in teams %}
        <tr>
            <td>{{ team[0] }}</td>
            <td><a href='/teams/{{ team[0] }}'>{{ team[1] }}</a></td>
            <td>{{ team[2] }}</td>
            <td>{{ team[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</section>

{% endblock %}
